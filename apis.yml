name: Sequen AI
description: 'Sequen AI operates a Behavior Design Engine — an AI-powered ranking and
  real-time, in-session personalization platform for consumer applications. Its proprietary
  Large Event Models (LEMs) generalize user behavior from sparse event data (clicks,
  scrolls, hovers, purchases) to dynamically rank and re-rank product discovery, search,
  recommendations, and advertising with sub-20ms latency. Products include Sequen IQ
  (LEM-based ranking on purpose-built Sequen Ranking Clusters), Sequen Ranktune (model
  building and experimentation), and Sequen Rumi (analytics and behavioral-insight
  dashboard). The platform integrates via API with existing stacks. Sequen AI is
  backed by Threshold Ventures. No public developer portal, API reference, SDKs, or
  OpenAPI definition are published at this time.'
